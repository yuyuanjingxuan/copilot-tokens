name: Release

# Push a tag like `v0.1.3` and this workflow packages the extension and
# publishes a GitHub Release with the .vsix attached — no manual upload.
#
# Usage:
#   git tag v0.1.3
#   git push --tags
#
# The GITHUB_TOKEN in CI has write access to releases (unlike the
# restricted token obtained locally via `git credential fill`).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: extension
        run: npm install

      - name: Package .vsix (validate manifest)
        working-directory: extension
        run: npm run package

      - name: Find .vsix
        id: vsix
        run: echo "path=$(ls extension/*.vsix)" >> "$GITHUB_OUTPUT"

      - name: Build release notes from CHANGELOG
        # The release body mirrors the matching "## <version>" section of
        # extension/CHANGELOG.md so GitHub Releases and the changelog never
        # drift apart. Falls back to a pointer when the section is missing.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 == "## " ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' extension/CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See extension/CHANGELOG.md in the repository for this release." > release-notes.md
          fi
          echo "" >> release-notes.md
          echo "**Full Changelog**: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" >> release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.vsix.outputs.path }}
          body: release-notes.md
