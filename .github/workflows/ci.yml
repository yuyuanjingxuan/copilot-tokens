name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax check
        run: python -m py_compile cli/copilot_tokens.py

      - name: Smoke test (fixture logs)
        run: python tests/test_smoke.py

      - name: Coverage
        run: |
          python -m pip install --quiet coverage
          python -m coverage run cli/copilot_tokens.py --root tests/fixtures/user --all > /dev/null
          python -m coverage run --append cli/copilot_tokens.py --root tests/fixtures/user --all --json > /dev/null
          python -m coverage run --append cli/copilot_tokens.py --root tests/fixtures/user --session test-sid-0001 > /dev/null
          python -m coverage report -m

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Compile TypeScript
        run: npm run compile

      - name: Package .vsix (validate manifest)
        run: npm run package

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: copilot-tokens-vsix
          path: extension/*.vsix
